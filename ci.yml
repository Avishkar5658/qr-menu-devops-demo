name: QR Menu CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f Dockerfile
          test -f docker-compose.yml

      - name: Build Docker image
        run: docker build -t quickbite-menu:${{ github.sha }} .
